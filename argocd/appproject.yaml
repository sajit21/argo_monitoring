# AGENT_CONTEXT: kind=AppProject apiGroup=argoproj.io/v1alpha1 name=monitoring ns=argocd | sourceRepos=[prometheus-community,grafana,https://github.com/sajit21/argo_monitoring.git] | destinations=[https://kubernetes.default.svc/monitoring] | clusterResourceWhitelist=[*/*] | desc=observability-stack
# AppProject: limits WHERE Argo CD may pull from and WHAT/WHERE it may deploy for the observability stack.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd            # the namespace your Argo CD is installed in
spec:
  description: Observability stack (kube-prometheus-stack, loki, alloy, tempo)
  sourceRepos:
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://github.com/sajit21/argo_monitoring.git             # this Git repository
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  # kube-prometheus-stack installs CRDs, ClusterRoles and the Namespace, which are cluster-scoped.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
