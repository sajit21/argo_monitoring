# values/loki.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: false

    # Enable retention only after configuring an appropriate
    # retention policy and verifying the storage configuration.

singleBinary:
  replicas: 1

  persistence:
    enabled: false

    # Uses ephemeral storage when no persistent volume is configured.
    # Logs may be lost when the pod is replaced.

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Disable components not needed for SingleBinary mode.
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

gateway:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false

    grafanaAgent:
      installOperator: false

  lokiCanary:
    enabled: false

test:
  enabled: false